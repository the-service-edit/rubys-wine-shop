<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emails | Ruby's Wine Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="studio.css?v=9">
</head>
<body>
<div id="app" class="app">
  <!-- left sidebar (browse mode) -->
  <aside id="side" class="side" aria-label="Emails">
    <div class="side-head">
      <div class="site-name"><img src="https://cdn.shopify.com/s/files/1/0836/3622/4220/files/rubys-logo.png?width=120" alt=""><div><b>Ruby&#x27;s Wine Shop</b><small>Emails</small></div></div>
    </div>
    <div class="side-scroll">
      <div class="side-title"><span>Emails</span><button class="icon-btn" id="btn-new" type="button" title="New email" aria-label="New email"></button></div>
      <p class="side-group">Your emails</p>
      <nav id="nav-emails" class="page-list"></nav>
      <div class="side-rule"></div>
      <nav class="page-list tools">
        <button type="button" id="btn-send" data-icon="send">Send from Shopify</button>
        <button type="button" id="btn-help" data-icon="help">Help</button>
      </nav>
    </div>
  </aside>

  <main class="main">
    <!-- top bar -->
    <header class="top" id="top">
      <div class="top-l">
        <button class="icon-btn back" id="btn-back" type="button" title="Back to emails" aria-label="Back to emails"></button>
        <button class="btn dark" id="btn-edit" type="button">Edit</button>
        <button class="btn" id="btn-exit" type="button" hidden>Exit</button>
        <span class="page-name" id="page-name"></span>
        <button class="icon-btn" id="btn-page" type="button" title="Subject line and preview text" aria-label="Email settings"></button>
      </div>
      <div class="top-c">
        <div class="seg" role="group" aria-label="Preview size">
          <button type="button" id="dev-desktop" class="on" title="Desktop" aria-label="Desktop view"></button>
          <button type="button" id="dev-mobile" title="Phone" aria-label="Phone view"></button>
        </div>
      </div>
      <div class="top-r">
        <span id="status" class="status" aria-live="polite"></span>
        <span class="edit-only" hidden>
          <button class="icon-btn" id="btn-undo" type="button" title="Undo (Cmd/Ctrl + Z)" aria-label="Undo" disabled></button>
          <button class="icon-btn" id="btn-redo" type="button" title="Redo (Cmd/Ctrl + Shift + Z)" aria-label="Redo" disabled></button>
        </span>
        <button class="btn dark" id="btn-copy" type="button">Copy for Shopify</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div id="banner" class="banner" hidden></div>
      <div class="frame-wrap" id="frame-wrap"><iframe id="frame" title="Your email"></iframe></div>
      <!-- editing overlay drawn over the email -->
      <div id="ov" class="ov" hidden>
        <div id="ov-box" class="ov-box"></div>
        <div id="ov-tools" class="ov-tools"></div>
        <button id="ov-add-top" class="ov-add" type="button">+ Add a section</button>
        <button id="ov-add-bot" class="ov-add" type="button">+ Add a section</button>
      </div>
    </div>
  </main>

  <!-- add section drawer -->
  <aside id="lib" class="lib" hidden aria-label="Add a section">
    <div class="lib-head"><h2>Add a section</h2><button class="icon-btn" id="lib-close" type="button" aria-label="Close"></button></div>
    <div class="lib-body">
      <nav id="lib-cats" class="lib-cats"></nav>
      <div id="lib-grid" class="lib-grid"></div>
    </div>
  </aside>

  <!-- right panel -->
  <aside id="panel" class="panel" hidden aria-label="Settings">
    <div class="panel-head"><h2 id="panel-title">Settings</h2><button class="icon-btn" id="panel-close" type="button" aria-label="Close"></button></div>
    <div id="panel-tabs" class="tabs" hidden></div>
    <div id="panel-body" class="panel-body"></div>
    <div class="panel-foot"><button class="btn dark" id="panel-done" type="button">Done</button></div>
  </aside>

  <div id="modal" class="modal" hidden role="dialog" aria-modal="true">
    <div class="modal-card"><div id="modal-body"></div></div>
  </div>
  <div id="et" class="et" hidden></div>
  <div id="toast" class="toast" hidden role="status"></div>
</div>
<script src="sections.js?v=9"></script>
<script src="app.js?v=9"></script>
</body>
</html>
